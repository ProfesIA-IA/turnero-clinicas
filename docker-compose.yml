services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: turnero
      POSTGRES_PASSWORD: turnero
      POSTGRES_DB: turnero
    ports:
      - "5432:5432"
    volumes:
      - turnero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnero -d turnero"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  turnero_pg:
